---
services:
  netbox:
    image: lscr.io/linuxserver/netbox:latest
    container_name: netbox
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo

      # Usuário administrador do NetBox
      - SUPERUSER_EMAIL=admin@example.com
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:?defina no .env (copie .env.example)}

      # FQDN ou IP do NetBox
      - ALLOWED_HOST=*

      # PostgreSQL
      - DB_NAME=netbox
      - DB_USER=netbox
      - DB_PASSWORD=${DB_PASSWORD:?defina no .env (copie .env.example)}
      - DB_HOST=netbox-db
      - DB_PORT=5432

      # Redis
      - REDIS_HOST=netbox-redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=default
      - REDIS_PASSWORD=${REDIS_PASSWORD:?defina no .env (copie .env.example)}
      - REDIS_DB_TASK=0
      - REDIS_DB_CACHE=1

    volumes:
      - ./netbox-config:/config
      - ./netbox-config/custom-cont-init.d:/custom-cont-init.d

    ports:
      - "8000:8000"

    restart: unless-stopped

    depends_on:
      - netbox-redis
      - netbox-db

  netbox-db:
    image: postgres:17-alpine
    container_name: netbox-db
    environment:
      - POSTGRES_DB=netbox
      - POSTGRES_USER=netbox
      - POSTGRES_PASSWORD=${DB_PASSWORD:?defina no .env (copie .env.example)}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  netbox-redis:
    image: redis:8-alpine
    container_name: netbox-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?defina no .env (copie .env.example)} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
